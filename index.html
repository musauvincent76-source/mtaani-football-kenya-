<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MTAANI #31</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#020d06;color:white;font-family:Arial, sans-serif}
.header{background:#010f08;display:flex;justify-content:space-between;align-items:center;padding:6px 8px;border-bottom:2px solid #0f4d1f;position:sticky;top:0;z-index:10}
.left{display:flex;gap:5px;align-items:center}
.ico{width:30px;height:30px;background:#0a2a14;border:1px solid #00ff88;border-radius:6px;display:flex;align-items:center;justify-content:center}
.free{background:#00ff88;color:#000;padding:5px 8px;border-radius:4px;font-weight:900;font-size:9px}
.mtaani{background:#3d0a14;border:1px solid #ff2040;padding:3px 8px;border-radius:4px;text-align:center}
.mtaani b{color:#00ff88;font-size:10px;display:block}
.mtaani small{font-size:7px}
.dia{background:#6de3ff;color:#000;padding:4px 10px;border-radius:15px;font-weight:900;font-size:10px}
.co{background:#ffcc00;color:#000;padding:4px 10px;border-radius:15px;font-weight:900;font-size:10px}

.wrap{padding:6px;display:grid;grid-template-columns:1.3fr 0.9fr 0.9fr;gap:6px;background:#020d06}
.card{border:1.5px solid #00ff88;border-radius:8px;overflow:hidden;min-height:110px;background:linear-gradient(180deg,#0a2212,#050f08)}
.head{padding:6px 8px;font-weight:900;font-size:11px;display:flex;justify-content:space-between}
.head.red{background:#b00}
.head.blue{background:#0077cc}
.head.orange{background:#cc5500}
.head.lblue{background:#00aaff;color:#000}
.head.black{background:#151515}
.head.green{background:#0a2f14}
.body{height:80px;background:transparent}

.span2{grid-column:span 2}
@media(max-width:700px){.wrap{grid-template-columns:1fr}.span2{grid-column:span 1}}
</style>
</head>
<body>

<div class="header">
<div class="left">
<div class="ico">⚙️</div>
<div class="free">FREE COINS</div>
<div class="mtaani"><b>MTAANI #31</b><small>70d 23h 53m</small></div>
</div>
<div class="left">
<div class="dia">💎 132</div>
<div class="co">🪙 358</div>
</div>
</div>

<div class="wrap">

<div class="card span2">
<div class="head red">CAREER <span>>> </span></div>
<div class="body"></div>
</div>

<div class="card">
<div class="head blue">SCENARIO <span>>> </span></div>
<div class="body"></div>
</div>

<div class="card">
<div class="head orange">OSMALIPA DRAFT <span>>> </span></div>
<div class="body"></div>
</div>

<div class="card span2">
<div class="head lblue">MTAANI LIVE <span>>> </span></div>
<div class="body"></div>
</div>

<div class="card">
<div class="head black">CLANS <span>>> </span></div>
<div class="body"></div>
</div>

<div class="card">
<div class="head green">DLL EVENT <span>>> </span></div>
<div class="body"></div>
</div>

<div class="card">
<div class="head green">CHALLENGES <span>>> </span></div>
<div class="body"></div>
</div>

<div class="card">
<div class="head green">TEAM <span>>> </span></div>
<div class="body"></div>

<div class="card">

<div class="card">

</div>

</div>

</body>
</html>
