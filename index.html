<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#020d06;color:#fff;font-family:Arial;overflow-x:hidden}
.top{width:100%;background:#010a0f;border:2px solid #00ff88;display:flex;justify-content:space-between;align-items:center;padding:6px 10px;flex-wrap:wrap;gap:6px}
.free{background:#00ff88;color:#000;padding:5px 12px;border-radius:6px;font-weight:900;font-size:10px}
.title{border:2px solid #00ff88;padding:4px 20px;background:#111;font-weight:900;font-size:18px;clip-path:polygon(10% 0,100% 0,90% 100%,0 100%)}
.diam{border:1.5px solid #00ff88;padding:4px 12px;border-radius:6px;font-size:11px;background:#0a1a2a}
.co{border:1.5px solid #00ff88;padding:4px 12px;border-radius:6px;font-size:11px;background:#0a1a2a;color:#ffcc00}

.wrap{padding:8px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;background:#061a2a;min-height:100vh}
.card{border:2px solid #00ff88;border-radius:8px;overflow:hidden;min-height:140px;background:#0a1a2a}
.head{padding:6px 10px;font-weight:900;font-size:13px}
.head.red{background:#cc0033}
.head.blue{background:linear-gradient(90deg,#0055ff,#00ccff)}
.head.orange{background:#ff6600}
.head.lblue{background:linear-gradient(90deg,#0055ff,#00ccff)}
.head.black{background:#111}
.head.green{background:#0a4d1a}
.body{height:100px;background:#0a1a2a}

.row2{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px;grid-column:span 3}
.row2 .card{min-height:110px}

@media(max-width:900px){.wrap{grid-template-columns:1fr 1fr}.row2{grid-column:span 2;grid-template-columns:1fr 1fr}}
@media(max-width:600px){.wrap{grid-template-columns:1fr}.row2{grid-column:span 1;grid-template-columns:1fr 1fr}}
</style>
</head>
<body>

<div class="top">
<div class="free">🎬 FREE COINS</div>
<div class="title">MTAANI #31</div>
<div style="display:flex;gap:6px">
<div class="diam">💎 diamonds 132</div>
<div class="co">💰 coins 358</div>
</div>
</div>

<div class="wrap">

<div class="card"><div class="head red">CAREER</div><div class="body"></div></div>
<div class="card"><div class="head blue">SCENARIO vs</div><div class="body"></div></div>
<div class="card"><div class="head orange">OSMALIPA DRAFT</div><div class="body"></div></div>

<div class="card"><div class="head lblue">MTAANI LIVE</div><div class="body"></div></div>
<div class="card"><div class="head black">CLANS</div><div class="body"></div></div>
<div class="card"><div class="head green">DLL EVENT</div><div class="body"></div></div>

<div class="row2">
<div class="card"><div class="head red">CHALLENGES</div><div class="body"></div></div>
<div class="card"><div class="head blue">TEAM</div><div class="body"></div></div>
<div class="card"><div class="head orange">TRANSFERS</div><div class="body"></div></div>
<div class="card"><div class="head green">MY CLUB</div><div class="body"></div></div>
</div>

</div>

</body>
</html>
