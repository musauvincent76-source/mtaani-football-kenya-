<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>MTAANI 22 PLAYERS</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;touch-action:none;user-select:none}
body{background:#0a4a12;overflow:hidden;width:100vw;height:100vh;font-family:Arial}
#gameCanvas{width:100vw;height:100vh;display:block}
#topBar{position:absolute;top:0;left:0;right:0;height:40px;background:rgba(0,0,0,0.88);border-bottom:3px solid #00ff88;display:flex;justify-content:space-between;align-items:center;padding:0 12px;color:#fff;font-weight:900;z-index:10;font-size:11px}
#controls{position:absolute;bottom:10px;left:10px;right:10px;display:flex;justify-content:space-between;align-items:flex-end;z-index:10;pointer-events:none}
.joy{pointer-events:auto;width:95px;height:95px;background:rgba(0,0,0,0.6);border:3px solid #00ff88;border-radius:50%;display:flex;align-items:center;justify-content:center}
.stick{width:38px;height:38px;background:#00ff88;border-radius:50%;border:2px solid #fff}
.btns{pointer-events:auto;display:flex;gap:10px}
.b{width:62px;height:62px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:900;font-size:9px;color:#fff;border:2.5px solid #fff}
.pass{background:#0055ff}.shoot{background:#ffcc00;color:#000;border-color:#000}
</style>
</head>
<body>
<div id="topBar"><div>🇰🇪 11 vs 11 <span id="score">0 - 0</span> 22 PLAYERS</div><div style="background:#000;color:#00ff88;padding:3px 8px;border-radius:10px;border:1px solid #00ff88">CLOSE CAM ● 22</div></div>
<canvas id="gameCanvas"></canvas>
<div id="controls">
<div class="joy" id="joy"><div class="stick" id="stick"></div></div>
<div class="btns"><div class="b pass" id="btnPass">PASS<br><b style="font-size:14px">C</b></div><div class="b shoot" id="btnShoot">SHOOT<br><b style="font-size:14px">A</b></div></div>
</div>
<script>
const canvas=document.getElementById('gameCanvas'), ctx=canvas.getContext('2d');
canvas.width=innerWidth*2; canvas.height=innerHeight*2;
let cam={x:0,y:0}, ball={x:600,y:425,vx:0,vy:0}, players=[], myPlayer, moveX=0,moveY=0,joyActive=false,joyCenter={x:0,y:0}, scoreK=0,scoreU=0;

function createPlayers(){
  players=[];
  // KENYA 11 - JEZI MOJA RED/BLACK WOTE - FORMATION 4-4-2
  players.push({x:120,y:425,human:false,num:1,jersey:'#cc0000',shorts:'#000',skin:'#c68642'}); // GK
  players.push({x:250,y:200,human:false,num:2,jersey:'#cc0000',shorts:'#000',skin:'#8d5524'}); // DEF
  players.push({x:250,y:300,human:false,num:5,jersey:'#cc0000',shorts:'#000',skin:'#c68642'});
  players.push({x:250,y:550,human:false,num:6,jersey:'#cc0000',shorts:'#000',skin:'#5a3a22'});
  players.push({x:250,y:650,human:false,num:3,jersey:'#cc0000',shorts:'#000',skin:'#8d5524'});
  players.push({x:400,y:200,human:false,num:7,jersey:'#cc0000',shorts:'#000',skin:'#c68642'}); // MID
  players.push({x:400,y:350,human:true,num:9,jersey:'#cc0000',shorts:'#000',skin:'#c68642'}); // YOU - 9
  players.push({x:400,y:500,human:false,num:8,jersey:'#cc0000',shorts:'#000',skin:'#8d5524'});
  players.push({x:400,y:650,human:false,num:11,jersey:'#cc0000',shorts:'#000',skin:'#c68642'});
  players.push({x:550,y:350,human:false,num:10,jersey:'#cc0000',shorts:'#000',skin:'#5a3a22'}); // STRIKER
  players.push({x:550,y:500,human:false,num:20,jersey:'#cc0000',shorts:'#000',skin:'#c68642'});

  // UGANDA 11 - JEZI MOJA RED/BLACK PIA - SAME JERSEY
  players.push({x:1080,y:425,human:false,num:1,jersey:'#cc0000',shorts:'#000',skin:'#5a3a22'}); // GK
  players.push({x:950,y:200,human:false,num:2,jersey:'#cc0000',shorts:'#000',skin:'#8d5524'});
  players.push({x:950,y:300,human:false,num:5,jersey:'#cc0000',shorts:'#000',skin:'#c68642'});
  players.push({x:950,y:550,human:false,num:6,jersey:'#cc0000',shorts:'#000',skin:'#5a3a22'});
  players.push({x:950,y:650,human:false,num:3,jersey:'#cc0000',shorts:'#000',skin:'#8d5524'});
  players.push({x:800,y:200,human:false,num:7,jersey:'#cc0000',shorts:'#000',skin:'#c68642'});
  players.push({x:800,y:350,human:false,num:8,jersey:'#cc0000',shorts:'#000',skin:'#8d5524'});
  players.push({x:800,y:500,human:false,num:11,jersey:'#cc0000',shorts:'#000',skin:'#c68642'});
  players.push({x:800,y:650,human:false,num:10,jersey:'#cc0000',shorts:'#000',skin:'#5a3a22'});
  players.push({x:650,y:350,human:false,num:9,jersey:'#cc0000',shorts:'#000',skin:'#c68642'});
  players.push({x:650,y:500,human:false,num:20,jersey:'#cc0000',shorts:'#000',skin:'#8d5524'});

  myPlayer=players[6]; // WEWE namba 9 katikati
  ball.x=myPlayer.x+20; ball.y=myPlayer.y;
}

function drawStadium(){
  ctx.fillStyle='#87ceeb'; ctx.fillRect(0,0,3000,150);
  ctx.fillStyle='#111'; ctx.fillRect(0-cam.x,50-cam.y,3000,40);
  ctx.fillStyle='#ffcc00'; ctx.font='bold 16px Arial'; ctx.fillText('MTAANI #31 - 22 PLAYERS - 11 vs 11 - JEZI MOJA RED',100-cam.x,75-cam.y);
  for(let i=0;i<400;i++){let cx=(i*37%3000), cy=90+(i*13%60); ctx.fillStyle=i%3==0?'#cc0000':i%3==1?'#00ff88':'#fff'; ctx.fillRect(cx-cam.x,cy-cam.y,4,6);}
  for(let i=0;i<3000;i+=50){ctx.fillStyle=i%100==0?'#1e9c2d':'#1a8c28'; ctx.fillRect(i-cam.x,150-cam.y,50,2000);}
  ctx.strokeStyle='rgba(255,255,255,0.9)'; ctx.lineWidth=3;
  ctx.strokeRect(50-cam.x,150-cam.y,1100,550);
  ctx.beginPath(); ctx.moveTo(600-cam.x,150-cam.y); ctx.lineTo(600-cam.x,700-cam.y); ctx.stroke();
  ctx.beginPath(); ctx.arc(600-cam.x,425-cam.y,75,0,Math.PI*2); ctx.stroke();
  ctx.strokeRect(50-cam.x,275-cam.y,130,300); ctx.strokeRect(1020-cam.x,275-cam.y,130,300);
  ctx.fillStyle='#fff'; ctx.fillRect(20-cam.x,350-cam.y,30,150); ctx.fillRect(1150-cam.x,350-cam.y,30,150);
  ctx.strokeStyle='#fff'; ctx.lineWidth=4; ctx.strokeRect(20-cam.x,350-cam.y,30,150); ctx.strokeRect(1150-cam.x,350-cam.y,30,150);
}

function drawPlayer(p){
  ctx.save(); ctx.translate(p.x-cam.x,p.y-cam.y);
  ctx.fillStyle='rgba(0,0,0,0.35)'; ctx.beginPath(); ctx.ellipse(0,22,13,4.5,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle=p.skin; ctx.fillRect(-5,10,4,10); ctx.fillRect(2,10,4,10);
  ctx.fillStyle='#fff'; ctx.fillRect(-5,14,4,4); ctx.fillRect(2,14,4,4);
  ctx.fillStyle='#111'; ctx.fillRect(-6,20,6,3.5); ctx.fillRect(1,20,6,3.5);
  ctx.fillStyle=p.shorts; ctx.fillRect(-8,1,16,10);
  ctx.fillStyle=p.jersey; ctx.fillRect(-10,-14,20,16);
  ctx.fillStyle='#fff'; ctx.font='bold 10px Arial'; ctx.textAlign='center'; ctx.fillText(p.num,0,0);
  ctx.fillStyle=p.skin; ctx.fillRect(-11,-11,3.5,8); ctx.fillRect(8,-11,3.5,8);
  ctx.fillStyle=p.skin; ctx.beginPath(); ctx.arc(0,-19,7.5,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle='#000'; ctx.lineWidth=0.5; ctx.stroke();
  ctx.fillStyle='#111'; ctx.beginPath(); ctx.arc(0,-24,7,Math.PI,0); ctx.fill();
  if(p.human){ctx.strokeStyle='#00ff88'; ctx.lineWidth=2.8; ctx.beginPath(); ctx.arc(0,2,18,0,Math.PI*2); ctx.stroke(); ctx.fillStyle='#00ff88'; ctx.font='bold 8px Arial'; ctx.fillText('WEWE',0,32);}
  ctx.restore();
}

function draw(){
  drawStadium();
  ctx.fillStyle='#fff'; ctx.strokeStyle='#222'; ctx.lineWidth=1.8;
  ctx.beginPath(); ctx.arc(ball.x-cam.x,ball.y-cam.y,7.5,0,Math.PI*2); ctx.fill(); ctx.stroke();
  ctx.fillStyle='#000'; ctx.beginPath(); ctx.arc(ball.x-cam.x+1.5,ball.y-cam.y-1,2,0,Math.PI*2); ctx.fill();
  players.forEach(drawPlayer);
}

function update(){
  if(myPlayer){myPlayer.x+=moveX*5; myPlayer.y+=moveY*5; myPlayer.x=Math.max(60,Math.min(1140,myPlayer.x)); myPlayer.y=Math.max(160,Math.min(690,myPlayer.y)); if(Math.hypot(myPlayer.x-ball.x,myPlayer.y-ball.y)<24){ball.x=myPlayer.x+15; ball.y=myPlayer.y+2;}}
  players.forEach(p=>{if(p.human)return; let dx=ball.x-p.x, dy=ball.y-p.y, d=Math.hypot(dx,dy); if(d<400){p.x+=dx/d*1.2; p.y+=dy/d*1.2; p.x=Math.max(60,Math.min(1140,p.x)); p.y=Math.max(160,Math.min(690,p.y)); if(d<18&&Math.random()<0.035){ball.vx=(Math.random()-0.5)*12; ball.vy=(Math.random()-0.5)*12;}}});
  ball.x+=ball.vx; ball.y+=ball.vy; ball.vx*=0.965; ball.vy*=0.965;
  if(ball.x>1150&&ball.y>350&&ball.y<500){scoreK++; document.getElementById('score').innerText=scoreK+' - '+scoreU; reset(); alert('GOAL! 🔥');}
  if(ball.x<50&&ball.y>350&&ball.y<500){scoreU++; document.getElementById('score').innerText=scoreK+' - '+scoreU; reset(); alert('GOAL!');}
  cam.x+=(ball.x - canvas.width/5 - cam.x)*0.11; cam.y+=(ball.y - canvas.height/3.5 - cam.y)*0.11;
}
function reset(){ball.x=600; ball.y=425; ball.vx=0; ball.vy=0; createPlayers();}
const joy=document.getElementById('joy'), stick=document.getElementById('stick');
function getCenter(){let r=joy.getBoundingClientRect(); return {x:r.left+r.width/2,y:r.top+r.height/2};}
joy.addEventListener('touchstart',e=>{joyActive=true; joyCenter=getCenter(); e.preventDefault();},{passive:false});
joy.addEventListener('mousedown',()=>{joyActive=true; joyCenter=getCenter();});
window.addEventListener('touchend',()=>{joyActive=false; stick.style.transform='translate(0,0)'; moveX=0; moveY=0;});
window.addEventListener('mouseup',()=>{joyActive=false; stick.style.transform='translate(0,0)'; moveX=0; moveY=0;});
window.addEventListener('touchmove',e=>{if(!joyActive)return; let t=e.touches[0],dx=t.clientX-joyCenter.x,dy=t.clientY-joyCenter.y,d=Math.hypot(dx,dy); if(d>35){dx=dx/d*35; dy=dy/d*35;} stick.style.transform=`translate(${dx}px,${dy}px)`; moveX=dx/35; moveY=dy/35;},{passive:false});
window.addEventListener('mousemove',e=>{if(!joyActive)return; let dx=e.clientX-joyCenter.x,dy=e.clientY-joyCenter.y,d=Math.hypot(dx,dy); if(d>35){dx=dx/d*35; dy=dy/d*35;} stick.style.transform=`translate(${dx}px,${dy}px)`; moveX=dx/35; moveY=dy/35;});
document.getElementById('btnPass').addEventListener('touchstart',e=>{e.preventDefault(); ball.vx=11; ball.vy=(Math.random()-0.5)*5;});
document.getElementById('btnPass').addEventListener('mousedown',()=>{ball.vx=11; ball.vy=(Math.random()-0.5)*5;});
document.getElementById('btnShoot').addEventListener('touchstart',e=>{e.preventDefault(); ball.vx=18; ball.vy=(Math.random()-0.5)*3;});
document.getElementById('btnShoot').addEventListener('mousedown',()=>{ball.vx=18; ball.vy=(Math.random()-0.5)*3;});
createPlayers();
(function loop(){update(); draw(); requestAnimationFrame(loop);})();
</script>
</body>
</html>
