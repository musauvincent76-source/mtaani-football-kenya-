<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>MTAANI #31 - MOJA TU</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#020d06}
#rotated{width:100vh;height:100vw;transform:rotate(90deg);transform-origin:0 0;position:absolute;top:0;left:100vw;background:#020d06;display:flex;flex-direction:column}
.top{height:11%;background:#010a0f;border-bottom:2px solid #00ff88;display:flex;justify-content:space-between;align-items:center;padding:0 10px}
.free{background:#00ff88;color:#000;padding:5px 10px;border-radius:4px;font-weight:900;font-size:10px;cursor:pointer}
.title{border:2px solid #00ff88;padding:4px 18px;background:#111;font-weight:900;font-size:14px;transform:skew(-12deg)}
.title span{display:block;transform:skew(12deg);color:#fff}
.coins{display:flex;gap:5px}
.coins div{border:1px solid #00ff88;padding:4px 8px;border-radius:5px;font-size:10px;background:#0a1a2a;color:#fff;font-weight:700}
.wrap{flex:1;display:grid;grid-template-columns:2fr 1fr 1fr 1fr;grid-template-rows:1.5fr 1fr;gap:5px;padding:5px;background:#061a2a}
.card{border:1.8px solid #00ff88;border-radius:8px;overflow:hidden;background:#0a1a2a;display:flex;flex-direction:column;cursor:pointer}
.head{padding:6px 8px;font-weight:900;font-size:11px;display:flex;justify-content:space-between;flex-shrink:0;color:#fff}
.head.red{background:#cc0033}.head.blue{background:#0055ff}.head.orange{background:#ff6600}.head.lblue{background:#0099ff;color:#000}.head.black{background:#222}.head.purple{background:#6600cc}
.body{flex:1;background:rgba(0,255,136,0.04)}
.big{grid-row:span 2}
/* CAREER NDANI */
#careerPage{display:none;flex:1;flex-direction:column;background:#061a2a}
.careerWrap{flex:1;padding:6px;display:grid;grid-template-columns:1fr 1fr;gap:6px}
.cItem{border:1.8px solid #00ff88;border-radius:10px;background:#0a1a2a;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px}
.cItem b{color:#00ff88;font-size:12px}
</style>
</head>
<body>
<div id="rotated">

<div class="top" id="topMenu">
<div style="display:flex;gap:6px;align-items:center"><div class="free">FREE COINS</div><div class="title"><span>MTAANI #31</span></div></div>
<div class="coins"><div>💎 132</div><div>🪙 358</div></div>
</div>

<div class="top" id="topCareer" style="display:none">
<div class="free" onclick="fungaCareer()">← RUDI</div>
<div class="title"><span>CAREER - NDANI</span></div>
<div class="coins"><div>💎 132 | 🪙 358</div></div>
</div>

<div class="wrap" id="menuPage">
<div class="card big" onclick="funguaCareer()"><div class="head red">CAREER MATCHES »</div><div class="body"></div></div>
<div class="card"><div class="head orange">OSMALIPA DRAFT »</div><div class="body"></div></div>
<div class="card"><div class="head lblue">MTAANI LIVE »</div><div class="body"></div></div>
<div class="card"><div class="head black">CLANS »</div><div class="body"></div></div>
<div class="card"><div class="head blue">TEAM »</div><div class="body"></div></div>
<div class="card"><div class="head orange">TRANSFERS »</div><div class="body"></div></div>
<div class="card"><div class="head purple">MY CLUB »</div><div class="body"></div></div>
</div>

<div id="careerPage">
<div class="careerWrap">
<div class="cItem"><b>📅 FIXTURES</b></div>
<div class="cItem"><b>📊 TABLE</b></div>
<div class="cItem"><b>👥 MY TEAM</b></div>
<div class="cItem"><b>🏆 RESULTS</b></div>
<div class="cItem"><b>📈 STATS</b></div>
<div class="cItem" style="border-color:#ff6600"><b style="color:#ff6600">⚽ CHEZA MECHI</b></div>
</div>
</div>

</div>

<script>
function funguaCareer(){
document.getElementById('menuPage').style.display='none';
document.getElementById('topMenu').style.display='none';
document.getElementById('careerPage').style.display='flex';
document.getElementById('topCareer').style.display='flex';
}
function fungaCareer(){
document.getElementById('careerPage').style.display='none';
document.getElementById('topCareer').style.display='none';
document.getElementById('menuPage').style.display='grid';
document.getElementById('topMenu').style.display='flex';
}
</script>
</body>
</html>
