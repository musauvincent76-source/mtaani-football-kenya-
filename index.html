<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>CAREER MATCHES</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#020d06}
#rotated{
width:100vh;height:100vw;
transform:rotate(90deg);
transform-origin:0 0;
position:absolute;top:0;left:100vw;
background:#020d06;display:flex;flex-direction:column;
}
.top{height:12%;background:#010a0f;border-bottom:2px solid #00ff88;display:flex;align-items:center;justify-content:space-between;padding:0 12px}
.back{background:#00ff88;color:#000;padding:6px 14px;border-radius:5px;font-weight:900;font-size:12px;cursor:pointer}
.logo-box{display:flex;align-items:center;gap:10px}
.logo{width:34px;height:34px;background:linear-gradient(135deg,#00ff88,#0055ff);border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;color:#000}
.logo-text b{color:#00ff88;font-size:13px;display:block}
.logo-text small{color:#aaa;font-size:9px}
.coins{display:flex;gap:6px}
.coins div{border:1px solid #00ff88;padding:4px 8px;border-radius:5px;font-size:10px;background:#0a1a2a;color:#fff}
.wrap{flex:1;padding:8px;background:#061a2a;display:flex;flex-direction:column;gap:8px}
.header-info{height:22%;border:1.5px solid #00ff88;border-radius:10px;background:linear-gradient(90deg,#0a2212,#0a1a2a);display:flex;align-items:center;justify-content:space-between;padding:0 15px}
.header-info h2{color:#00ff88;font-size:14px}
.header-info p{color:#aaa;font-size:10px;margin-top:4px}
.boxes{flex:1;display:grid;grid-template-columns:1fr 2fr 2fr;grid-template-rows:1fr 1fr;gap:8px}
.card{border:1.8px solid #00ff88;border-radius:10px;overflow:hidden;background:#0a1a2a;display:flex;flex-direction:column}
.card .head{padding:6px 10px;font-weight:900;font-size:11px;background:#cc0033;color:#fff}
.card .body{flex:1;display:flex;align-items:center;justify-content:center;color:#00ff88;font-weight:900;font-size:13px;background:rgba(0,255,136,0.05)}
.small{grid-row:span 2}
</style>
</head>
<body>
<div id="rotated">

<div class="top">
<div class="back" onclick="goBack()">← RUDI MENU</div>
<div class="logo-box">
<div class="logo">M</div>
<div class="logo-text"><b>CAREER MATCHES</b><small>Season Mode</small></div>
</div>
<div class="coins"><div>💎 132</div><div>🪙 358</div></div>
</div>

<div class="wrap">
<div class="header-info">
<div>
<h2>⚽ MTAANI CAREER SEASON 1</h2>
<p>Cheza ligi, panda division</p>
</div>
<div style="background:#00ff88;color:#000;padding:8px 14px;border-radius:6px;font-weight:900;font-size:11px">START ▶</div>
</div>

<div class="boxes">
<div class="card small"><div class="head">STATS</div><div class="body">KADOGO</div></div>
<div class="card"><div class="head" style="background:#0055ff">FIXTURES »</div><div class="body">KUBWA 1</div></div>
<div class="card"><div class="head" style="background:#ff6600">TABLE »</div><div class="body">KUBWA 2</div></div>
<div class="card"><div class="head" style="background:#0a4d1a">SCENARIO »</div><div class="body">KUBWA 3</div></div>
<div class="card"><div class="head" style="background:#6600cc">CHALLENGES »</div><div class="body">KUBWA 4</div></div>
</div>

</div>
</div>

<script>
function goBack(){
  window.location.href = 'index.html';
}
</script>

</body>
</html>
