<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>MTAANI #31</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100vh;width:100vw;overflow:hidden;background:#020d06;color:#fff;font-family:Arial, sans-serif}
body{display:flex;flex-direction:column}

.top{height:11vh;min-height:38px;max-height:50px;background:#010a0f;border-bottom:2px solid #00ff88;display:flex;justify-content:space-between;align-items:center;padding:0 8px}
.left{display:flex;gap:5px;align-items:center}
.free{background:#00ff88;color:#000;padding:4px 8px;border-radius:4px;font-weight:900;font-size:8px}
.title{border:2px solid #00ff88;padding:3px 14px;background:#111;font-weight:900;font-size:12px;transform:skew(-12deg)}
.title span{display:block;transform:skew(12deg)}
.coins{display:flex;gap:4px}
.coins div{border:1px solid #00ff88;padding:3px 6px;border-radius:4px;font-size:8px;background:#0a1a2a;font-weight:700}

/* HAPA NDIO SIRI - 5 COLUMNS x 2 ROWS = 10 BOXES ZOTE KWA SCREEN MOJA */
.wrap{height:89vh;display:grid;grid-template-columns:repeat(5, 1fr);grid-template-rows:1fr 1fr;gap:4px;padding:4px;background:#061a2a}

.card{border:1.5px solid #00ff88;border-radius:6px;overflow:hidden;background:#0a1a2a;display:flex;flex-direction:column}
.head{padding:4px 6px;font-weight:900;font-size:8px;display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
.head.red{background:#cc0033}
.head.blue{background:#0055ff}
.head.orange{background:#ff6600}
.head.lblue{background:#0099ff;color:#000}
.head.black{background:#222}
.head.green{background:#0a4d1a}
.head.purple{background:#6600cc}
.body{flex:1;background:rgba(0,255,136,0.04)}

/* Kama simu imesimama portrait - mwambie a-rotate */
@media (orientation: portrait){
.wrap{display:none}
.top{display:none}
body::after{content:"↻ ROTATE SIMU IWE LANDSCAPE NDIO UONE BOX 10 ZOTE";position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#020d06;color:#00ff88;font-weight:900;font-size:16px;text-align:center;padding:20px}
}
</style>
</head>
<body>

<div class="top">
<div class="left">
<div class="free">FREE COINS</div>
<div class="title"><span>MTAANI #31</span></div>
</div>
<div class="coins">
<div>💎 132</div>
<div>🪙 358</div>
<div>[POC] PRM FC</div>
</div>
</div>

<div class="wrap">

<!-- ROW 1 - BOX 5 JUU -->
<div class="card"><div class="head red">CAREER <span>»</span></div><div class="body"></div></div>
<div class="card"><div class="head blue">SCENARIO <span>»</span></div><div class="body"></div></div>
<div class="card"><div class="head orange">OSMALIPA DRAFT <span>»</span></div><div class="body"></div></div>
<div class="card"><div class="head lblue">MTAANI LIVE <span>»</span></div><div class="body"></div></div>
<div class="card"><div class="head black">CLANS <span>»</span></div><div class="body"></div></div>

<!-- ROW 2 - BOX 5 CHINI -->
<div class="card"><div class="head green">DLL EVENT <span>»</span></div><div class="body"></div></div>
<div class="card"><div class="head red">CHALLENGES <span>»</span></div><div class="body"></div></div>
<div class="card"><div class="head blue">TEAM <span>»</span></div><div class="body"></div></div>
<div class="card"><div class="head orange">TRANSFERS <span>»</span></div><div class="body"></div></div>
<div class="card"><div class="head purple">MY CLUB <span>»</span></div><div class="body"></div></div>

</div>

</body>
</html>
